<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxel Craft Demo</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #87ceeb;
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      color: #fff;
      background: rgba(0, 0, 0, 0.45);
      padding: 10px 12px;
      border-radius: 8px;
      line-height: 1.35;
      user-select: none;
      font-size: 14px;
    }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      pointer-events: none;
      z-index: 9;
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
    }

    #crosshair::before {
      width: 14px;
      height: 2px;
      top: 6px;
      left: 0;
    }

    #crosshair::after {
      width: 2px;
      height: 14px;
      left: 6px;
      top: 0;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      z-index: 11;
    }

    #overlay-content {
      text-align: center;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 12px;
      padding: 18px 20px;
      max-width: min(90vw, 420px);
    }

    #start-btn {
      margin-top: 12px;
      border: 0;
      padding: 10px 14px;
      border-radius: 8px;
      background: #3f8cff;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    #overlay-tip {
      margin-top: 10px;
      opacity: 0.85;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="hud">
    <strong>Voxel Craft Demo</strong><br>
    WASD: move | Space: jump | Shift: run<br>
    LMB: remove block | RMB: place block
  </div>
  <div id="crosshair"></div>
  <div id="overlay">
    <div id="overlay-content">
      <div>Нажми кнопку, чтобы начать</div>
      <button id="start-btn" type="button">Старт</button>
      <div id="overlay-tip">Если захват мыши недоступен, игра всё равно запустится.</div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
